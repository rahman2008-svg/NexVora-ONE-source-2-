name: NexVora ONE - Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APP_VERSION: "1.0.0"
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fetch upstream CodeMirror LSP client
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f codemirror-lsp-client/package.json ]]; then
            rm -rf codemirror-lsp-client
            git clone --depth 1 https://github.com/Acode-Foundation/codemirror-lsp-client.git codemirror-lsp-client
          fi
          test -f codemirror-lsp-client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # v4 avoids the obsolete SDK "tools" package requested by setup-android@v3.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('config.xml', 'package.json', 'package-lock.json', 'build-extras.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm dependencies and Cordova Android platform/plugins
        shell: bash
        run: |
          set -euo pipefail
          node utils/setup.js

      - name: Verify required NexVora test files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/unit/toolbox.test.js
            tests/unit/toolboxFormat.test.js
            tests/unit/apiStudio.test.js
            tests/unit/integrations.test.js
            tests/unit/databaseSql.test.js
            tests/unit/gitStudio.test.js
            tests/unit/gitCredentials.test.js
            tests/unit/aiStudio.test.js
            tests/unit/deploy.test.js
            tests/unit/zip.test.js
            tests/unit/projects.test.js
            tests/unit/appStudio.test.js
            tests/unit/nexvoraConfig.test.js
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error::Missing test file: $file"; exit 1; }
          done

      - name: NexVora module tests (blocking)
        run: |
          npx vitest run \
            tests/unit/toolbox.test.js \
            tests/unit/toolboxFormat.test.js \
            tests/unit/apiStudio.test.js \
            tests/unit/integrations.test.js \
            tests/unit/databaseSql.test.js \
            tests/unit/gitStudio.test.js \
            tests/unit/gitCredentials.test.js \
            tests/unit/aiStudio.test.js \
            tests/unit/deploy.test.js \
            tests/unit/zip.test.js \
            tests/unit/projects.test.js \
            tests/unit/appStudio.test.js \
            tests/unit/nexvoraConfig.test.js

      - name: Full upstream test suite (reported, non-blocking)
        id: upstream_tests
        continue-on-error: true
        run: npm test

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          npm run build -- d apk
          mkdir -p dist
          APK="$(find platforms/android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Debug APK was not produced."
            find platforms/android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$APK" dist/NexVora-ONE-Debug.apk
          test -s dist/NexVora-ONE-Debug.apk

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          npm run build -- p apk
          APK="$(find platforms/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::Release APK was not produced."
            find platforms/android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$APK" dist/NexVora-ONE-Release-unsigned.apk
          test -s dist/NexVora-ONE-Release-unsigned.apk

      - name: Sign release APK when signing secrets are configured
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" && -z "$KEYSTORE_PASSWORD" && -z "$KEY_ALIAS" && -z "$KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; unsigned release APK will be retained as a build artifact."
            exit 0
          fi
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure all four Android signing secrets, or remove all four."
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nexvora-release.jks"
          "$BT/zipalign" -f -p 4 dist/NexVora-ONE-Release-unsigned.apk dist/NexVora-ONE-Release-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/nexvora-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out dist/NexVora-ONE-Release.apk \
            dist/NexVora-ONE-Release-aligned.apk
          "$BT/apksigner" verify --verbose dist/NexVora-ONE-Release.apk
          rm -f dist/NexVora-ONE-Release-aligned.apk "$RUNNER_TEMP/nexvora-release.jks"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Verify APKs and write build metadata
        shell: bash
        env:
          UPSTREAM_TESTS_OUTCOME: ${{ steps.upstream_tests.outcome }}
          RELEASE_SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          set -euo pipefail
          test -s dist/NexVora-ONE-Debug.apk
          test -s dist/NexVora-ONE-Release-unsigned.apk
          {
            echo "app=NexVora ONE"
            echo "version=$APP_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run=$GITHUB_RUN_ID"
            echo "nexvora_module_tests=passed"
            echo "upstream_tests_outcome=$UPSTREAM_TESTS_OUTCOME"
            echo "release_signed=$RELEASE_SIGNED"
            echo "built_at=$(date -u +%FT%TZ)"
            echo
            sha256sum dist/*.apk
          } > dist/build-info.txt
          ls -lh dist/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-ONE-APKs
          path: |
            dist/*.apk
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # Stable direct APK URL for main/dispatch builds; version tags publish versioned releases.
      - name: Publish direct APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'continuous' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('NexVora ONE {0}', github.ref_name) || 'NexVora ONE - Latest CI Build' }}
          body: |
            Automated NexVora ONE Android build.
            The Debug APK is signed by the Android debug build system and can be installed for testing.
            The Release APK is included only when repository signing secrets are configured.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            dist/NexVora-ONE-Debug.apk
            dist/NexVora-ONE-Release.apk
            dist/build-info.txt
