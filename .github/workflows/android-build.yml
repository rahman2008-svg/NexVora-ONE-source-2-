
name: NexVora ONE - Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      APP_VERSION: "1.0.0"
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # 2. Restore CodeMirror submodule
      - name: Fetch CodeMirror LSP client
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f codemirror-lsp-client/package.json ]; then
            rm -rf codemirror-lsp-client

            git clone --depth 1 \
              https://github.com/Acode-Foundation/codemirror-lsp-client.git \
              codemirror-lsp-client
          fi

          test -f codemirror-lsp-client/package.json

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # 4. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

      # 6. Gradle cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('config.xml', 'package.json', 'package-lock.json', 'build-extras.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 7. Install dependencies and Cordova
      - name: Install dependencies and Cordova platform/plugins
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking local Cordova dependency..."

          node -e "
            const p = require('./package.json');
            if (!p.dependencies || !p.dependencies.cordova) {
              console.error('Cordova dependency missing from package.json');
              process.exit(1);
            }
          "

          # IMPORTANT:
          # npm run automatically adds node_modules/.bin to PATH.
          # setup.js installs dependencies and invokes Cordova commands.
          npm run setup

          # Verify Cordova is available
          test -x node_modules/.bin/cordova

          ./node_modules/.bin/cordova --version

          # Verify Android platform
          ./node_modules/.bin/cordova platform ls

          echo "Cordova setup completed successfully."

      # 8. Verify required tests
      - name: Verify NexVora test files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            tests/unit/toolbox.test.js
            tests/unit/toolboxFormat.test.js
            tests/unit/apiStudio.test.js
            tests/unit/integrations.test.js
            tests/unit/databaseSql.test.js
            tests/unit/gitStudio.test.js
            tests/unit/gitCredentials.test.js
            tests/unit/aiStudio.test.js
            tests/unit/deploy.test.js
            tests/unit/zip.test.js
            tests/unit/projects.test.js
            tests/unit/appStudio.test.js
            tests/unit/nexvoraConfig.test.js
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing test file: $file"
              exit 1
            fi
          done

          echo "All required test files found."

      # 9. NexVora module tests
      - name: NexVora module tests
        shell: bash
        run: |
          set -euo pipefail

          npx vitest run \
            tests/unit/toolbox.test.js \
            tests/unit/toolboxFormat.test.js \
            tests/unit/apiStudio.test.js \
            tests/unit/integrations.test.js \
            tests/unit/databaseSql.test.js \
            tests/unit/gitStudio.test.js \
            tests/unit/gitCredentials.test.js \
            tests/unit/aiStudio.test.js \
            tests/unit/deploy.test.js \
            tests/unit/zip.test.js \
            tests/unit/projects.test.js \
            tests/unit/appStudio.test.js \
            tests/unit/nexvoraConfig.test.js

      # 10. Full upstream tests
      - name: Full upstream test suite
        id: upstream_tests
        continue-on-error: true
        run: npm test

      # 11. Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          npm run build -- d apk

          mkdir -p dist

          APK="$(find platforms/android/app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not generated."

            find platforms/android/app/build/outputs \
              -type f -print || true

            exit 1
          fi

          cp "$APK" dist/NexVora-ONE-Debug.apk

          test -s dist/NexVora-ONE-Debug.apk

          echo "Debug APK created successfully."

      # 12. Release APK
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          npm run build -- p apk

          APK="$(find platforms/android/app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."

            find platforms/android/app/build/outputs \
              -type f -print || true

            exit 1
          fi

          cp "$APK" dist/NexVora-ONE-Release-unsigned.apk

          test -s dist/NexVora-ONE-Release-unsigned.apk

          echo "Release APK created successfully."

      # 13. Optional APK signing
      - name: Sign Release APK
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] &&
             [ -z "$KEYSTORE_PASSWORD" ] &&
             [ -z "$KEY_ALIAS" ] &&
             [ -z "$KEY_PASSWORD" ]; then

            echo "configured=false" >> "$GITHUB_OUTPUT"

            echo "Signing secrets not configured."
            echo "Unsigned release APK will be retained."

            exit 0
          fi

          if [ -z "$KEYSTORE_B64" ] ||
             [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] ||
             [ -z "$KEY_PASSWORD" ]; then

            echo "::error::All four signing secrets are required."
            exit 1
          fi

          BT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > "$RUNNER_TEMP/release.jks"

          "$BT/zipalign" -f -p 4 \
            dist/NexVora-ONE-Release-unsigned.apk \
            dist/NexVora-ONE-Release-aligned.apk

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out dist/NexVora-ONE-Release.apk \
            dist/NexVora-ONE-Release-aligned.apk

          "$BT/apksigner" verify --verbose \
            dist/NexVora-ONE-Release.apk

          rm -f dist/NexVora-ONE-Release-aligned.apk
          rm -f "$RUNNER_TEMP/release.jks"

          echo "configured=true" >> "$GITHUB_OUTPUT"

      # 14. Verify APK and metadata
      - name: Verify APKs and write metadata
        shell: bash
        env:
          UPSTREAM_TESTS_OUTCOME: ${{ steps.upstream_tests.outcome }}
          RELEASE_SIGNED: ${{ steps.signing.outputs.configured }}

        run: |
          set -euo pipefail

          test -s dist/NexVora-ONE-Debug.apk
          test -s dist/NexVora-ONE-Release-unsigned.apk

          {
            echo "app=NexVora ONE"
            echo "version=$APP_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run=$GITHUB_RUN_ID"
            echo "module_tests=passed"
            echo "upstream_tests=$UPSTREAM_TESTS_OUTCOME"
            echo "release_signed=$RELEASE_SIGNED"
            echo "built_at=$(date -u +%FT%TZ)"
            echo
            sha256sum dist/*.apk
          } > dist/build-info.txt

          ls -lh dist/

      # 15. Upload artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-ONE-APKs
          path: |
            dist/*.apk
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # 16. Publish GitHub Release
      - name: Publish direct APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'continuous' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('NexVora ONE {0}', github.ref_name) || 'NexVora ONE - Latest Build' }}
          body: |
            NexVora ONE automated Android build.

            Debug APK:
            Signed with Android debug key for testing.

            Release APK:
            Included when signing secrets are configured.

          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            dist/NexVora-ONE-Debug.apk
            dist/NexVora-ONE-Release.apk
            dist/build-info.txt

