name: NexVora ONE - Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed only to attach APKs to a GitHub Release on version tags
    env:
      APP_VERSION: "1.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch codemirror-lsp-client (upstream submodule, not vendored in this repo)
        run: |
          if [ ! -f codemirror-lsp-client/package.json ]; then
            rm -rf codemirror-lsp-client
            git clone --depth 1 https://github.com/Acode-Foundation/codemirror-lsp-client codemirror-lsp-client
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('config.xml', 'package.json', 'build-extras.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies and Cordova platform/plugins
        run: |
          npm install -g cordova@13
          node utils/setup.js

      - name: NexVora module tests (blocking)
        run: >
          npx vitest run
          tests/unit/toolbox.test.js tests/unit/toolboxFormat.test.js tests/unit/apiStudio.test.js
          tests/unit/integrations.test.js tests/unit/databaseSql.test.js tests/unit/gitStudio.test.js
          tests/unit/gitCredentials.test.js tests/unit/aiStudio.test.js tests/unit/deploy.test.js
          tests/unit/zip.test.js tests/unit/projects.test.js tests/unit/appStudio.test.js
          tests/unit/nexvoraConfig.test.js

      - name: Full upstream test suite (reported, non-blocking)
        id: tests
        continue-on-error: true
        run: npm test

      - name: Build debug APK
        run: |
          npm run build -- d apk
          APK=$(find platforms/android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          mkdir -p dist
          cp "$APK" dist/NexVora-ONE-Debug.apk

      - name: Build release APK
        run: |
          npm run build -- p apk
          APK=$(find platforms/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          cp "$APK" dist/NexVora-ONE-Release-unsigned.apk

      - name: Sign release APK (only when signing secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets configured: release APK stays unsigned (not installable until signed)."
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 dist/NexVora-ONE-Release-unsigned.apk dist/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out dist/NexVora-ONE-Release.apk dist/aligned.apk
          "$BT/apksigner" verify dist/NexVora-ONE-Release.apk
          rm -f dist/aligned.apk "$RUNNER_TEMP/release.jks"

      - name: Write build metadata
        run: |
          {
            echo "app=NexVora ONE"
            echo "version=$APP_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run=$GITHUB_RUN_ID"
            echo "unit_tests_outcome=${{ steps.tests.outcome }}"
            echo "built_at=$(date -u +%FT%TZ)"
          } > dist/build-info.txt
          sha256sum dist/*.apk >> dist/build-info.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-ONE-Debug
          path: dist/NexVora-ONE-Debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-ONE-Release
          path: |
            dist/NexVora-ONE-Release*.apk
            dist/build-info.txt
          if-no-files-found: error

      - name: Attach APKs to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NexVora-ONE-Debug.apk
            dist/NexVora-ONE-Release*.apk
            dist/build-info.txt
